<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eeeeee" />
  <title>Quiz</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/rngl.css" />
</head>
<body>
  <div id="quizApp" class="quiz-shell">
    <section id="homeScreen" class="screen screen-home active" aria-label="Quiz home">
      <header class="hub-topbar">
        <h1 class="hub-brand">Quiz</h1>
        <button id="hubFullscreenButton" class="hub-fullscreen-button" type="button" aria-label="Enter fullscreen">
          <svg id="hubFullscreenIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5"></path><path d="M16 3h5v5"></path>
            <path d="M21 16v5h-5"></path><path d="M3 16v5h5"></path>
          </svg>
          <span id="hubFullscreenLabel">Fullscreen</span>
        </button>
      </header>
      <main class="hub-main">
        
      <div class="content">

        <section class="game-grid" aria-label="Games">

          <button class="app-tile" type="button" data-file="missingword.html" data-name="Missing Word">
            <div class="tile-card">
              <svg class="icon missing-word-icon" viewBox="0 0 120 120" aria-hidden="true">
                <!-- continuous row of answer blanks behind the question mark -->
                <path class="mw-blanks" d="M8 70h16M32 70h16M56 70h16M80 70h16M104 70h8"></path>
                <!-- deliberately overlays/covers the middle blanks -->
                <text class="mw-question" x="60" y="86" text-anchor="middle">?</text>
              </svg>
            </div>
            <span class="tile-title">Missing Word</span>
          </button>

          <button class="app-tile" type="button" data-file="missingwordpokemon.html" data-name="Missing Word - Pokemon">
            <div class="tile-card">
              <svg class="icon pokemon-ball pokemon-missing-icon" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="top" cx="60" cy="60" r="46"></circle>
                <path d="M14 60h92"></path>
                <circle class="center" cx="60" cy="60" r="14"></circle>
                <!-- large overlay question mark -->
                <text class="pokemon-question" x="60" y="84" text-anchor="middle">?</text>
              </svg>
            </div>
            <span class="tile-title">Missing Word - Pokemon</span>
          </button>

          <button class="app-tile" type="button" data-file="hangman1.html" data-name="Hangman">
            <div class="tile-card">
              <svg class="icon hangman-icon" viewBox="0 0 120 120" aria-hidden="true">
                <path d="M17 106h58M30 106V12H84V28"></path>
                <path d="M84 28v12"></path>
                <circle cx="84" cy="50" r="10"></circle>
                <path d="M84 60v22M84 67L70 76M84 67l14 9M84 82L74 96M84 82l10 14"></path>
              </svg>
            </div>
            <span class="tile-title">Hangman</span>
          </button>

          <button class="app-tile" type="button" data-file="hangmanpokemon.html" data-name="Hangman - Pokemon">
            <div class="tile-card">
              <svg class="icon hangman-pokemon-icon" viewBox="0 0 120 120" aria-hidden="true">
                <path d="M17 106h58M30 106V12H84V28"></path>
                <path d="M84 28v15"></path>
                <circle cx="84" cy="62" r="17"></circle>
                <path d="M67 62h34"></path>
                <circle cx="84" cy="62" r="5.8" fill="#fff"></circle>
              </svg>
            </div>
            <span class="tile-title">Hangman - Pokemon</span>
          </button>

          <button class="app-tile" type="button" data-file="rngl.html" data-name="Random Letter">
            <div class="tile-card">
              <svg class="icon" viewBox="0 0 120 120" aria-hidden="true">
                <rect x="24" y="24" width="72" height="72" rx="10"></rect>
                <text x="60" y="76" text-anchor="middle" font-size="54">A</text>
              </svg>
            </div>
            <span class="tile-title">Random Letter</span>
          </button>

        </section>

        <h2 class="tools-heading">Tools</h2>

        <section class="tools" aria-label="Tools">
          <button class="app-tile" type="button" data-file="topicticker.html" data-name="Topic Ticker">
            <div class="tile-card">
              <svg class="icon ticker-icon" viewBox="0 0 120 120" aria-hidden="true">
                <path class="ticker-line" d="M17 35h30M58 35h44"></path>
                <path class="ticker-line" d="M17 60h49M77 60h25"></path>
                <path class="ticker-line" d="M17 85h20M48 85h54"></path>
                <circle class="ticker-dot" cx="52" cy="35" r="3.5"></circle>
                <circle class="ticker-dot" cx="71" cy="60" r="3.5"></circle>
                <circle class="ticker-dot" cx="42" cy="85" r="3.5"></circle>
              </svg>
            </div>
            <span class="tile-title">Topic Ticker</span>
          </button>
        </section>

      </div>
    
      </main>
    </section>

    <section id="rnglScreen" class="screen screen-rngl" aria-label="Random Letter">
      
  <div class="rngl-app">
    <header class="rngl-topbar">
      <button
        id="rnglHomeButton"
        class="fullscreen-button rngl-home-button"
        type="button"
        aria-label="Back to Home"
        title="Home"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11.5 12 4l8 7.5"></path>
          <path d="M6.5 10.5V20h11v-9.5"></path>
        </svg>
        <span>Home</span>
      </button>

      <button
        id="fullscreenButton"
        class="fullscreen-button"
        type="button"
        aria-label="Enter fullscreen"
        title="Fullscreen"
      >
        <svg id="fullscreenIcon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5"></path>
          <path d="M16 3h5v5"></path>
          <path d="M21 16v5h-5"></path>
          <path d="M3 16v5h5"></path>
        </svg>
        <span id="fullscreenLabel">Fullscreen</span>
      </button>

      <label class="ideas-control">
        <span>Ideas</span>
        <input id="ideasToggle" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
      </label>
    </header>

    <main class="rngl-main">
      <section class="generator" aria-label="Random letter generator">
        <button
          id="letterCard"
          class="letter-card"
          type="button"
          aria-label="Generate a random letter"
        >
          <span id="letter" class="letter" aria-live="polite">A</span>
          <span
            id="tunnelLayer"
            class="tunnel-layer"
            aria-hidden="true"
          ></span>

          <span
            id="wheelScene"
            class="wheel-scene"
            aria-hidden="true"
          >
            <span id="wheelLayout" class="wheel-layout">
              <span id="wheelVisual" class="wheel-visual">
                <svg
                  class="wheel-svg"
                  viewBox="0 0 300 300"
                  aria-hidden="true"
                >
                  <g id="wheelSpinner" class="wheel-spinner"></g>
                  <circle
                    cx="150"
                    cy="150"
                    r="29"
                    fill="#ffffff"
                    stroke="#d4dbe4"
                    stroke-width="3"
                  ></circle>
                </svg>
                <span class="wheel-pointer"></span>
              </span>

              <span id="wheelWinner" class="wheel-winner"></span>
            </span>
          </span>
        </button>

        <button id="generateButton" class="generate-button" type="button">
          Generate
        </button>
      </section>
    </main>

    <aside
      id="tickerShell"
      class="ticker-shell"
      aria-label="Topic ideas"
      aria-hidden="true"
    >
      <div class="ticker-stack">
        <div class="ticker-viewport">
          <div id="tickerTrack1" class="ticker-track">
            <div id="tickerGroup1A" class="ticker-group"></div>
            <div id="tickerGroup1B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>

        <div class="ticker-viewport">
          <div id="tickerTrack2" class="ticker-track">
            <div id="tickerGroup2A" class="ticker-group"></div>
            <div id="tickerGroup2B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>

        <div class="ticker-viewport">
          <div id="tickerTrack3" class="ticker-track">
            <div id="tickerGroup3A" class="ticker-group"></div>
            <div id="tickerGroup3B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>

        <div class="ticker-viewport">
          <div id="tickerTrack4" class="ticker-track">
            <div id="tickerGroup4A" class="ticker-group"></div>
            <div id="tickerGroup4B" class="ticker-group" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  
    </section>

    <section id="placeholderScreen" class="screen screen-placeholder" aria-live="polite">
      <button id="placeholderHomeButton" class="placeholder-home" type="button">Home</button>
      <div class="placeholder-card">
        <div class="placeholder-title" id="placeholderTitle">Game</div>
        <div class="placeholder-text">This screen is next in the integration queue.</div>
      </div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
